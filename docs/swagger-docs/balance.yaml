paths:
  /balances/deposit/{userId}:
    post:
      summary: Deposit funds to a client
      tags:
        - Balances
      parameters:
        - in: path
          name: userId
          schema:
            type: integer
          required: true
          description: ID of the client receiving the deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - amount
              properties:
                userId:
                  type: integer
                amount:
                  type: number
      responses:
        200:
          description: Deposit successful
        500:
          description: Server error
